<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Attendance Percentage Register">

<title>Attendance Register</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

<h1>Smart Student Attendance Percentage Register</h1>

<button id="themeToggle">🌙 Dark Mode</button>

</header>


<main>

<section class="form-section">

<h2>Add Attendance Record</h2>

<form id="attendanceForm">

<input type="text" id="name" placeholder="Student Name" required>

<select id="subject">

<option>MAI</option>
<option>GLB</option>
<option>DSA</option>
<option>FWD</option>
<option>ENG</option>

</select>

<select id="classtype">

<option>Lecture Hour</option>
<option>Practical</option>
<option>Tutorial</option>
<option>Skill</option>

</select>

<input type="number" id="total" placeholder="Total Classes" required>

<input type="number" id="attended" placeholder="Classes Attended" required>

<button type="submit">Add Record</button>

</form>

</section>


<section>

<h2>Attendance Records</h2>

<table id="table">

<thead>

<tr>
<th>Name</th>
<th>Subject</th>
<th>Class Type</th>
<th>Total</th>
<th>Attended</th>
<th>Percentage</th>
<th>Status</th>
</tr>

</thead>

<tbody></tbody>

</table>

</section>

</main>

<script src="script.js"></script>

</body>
</html>
